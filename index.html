<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A050E">
<title>Кофейный Оракул — Гадание и Тайны Судьбы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===================== ТЕМА ===================== */
:root{--violet:#12091A;--obsidian:#0A050E;--burgundy:#5A1430;--wine:#3a0d22;--gold:#D4AF37;--gold-2:#F3D98B;--gold-dim:rgba(212,175,55,.35);
--text:#F4ECF7;--text-2:rgba(244,236,247,.74);--text-3:rgba(244,236,247,.5);--line:rgba(212,175,55,.22);--line-2:rgba(212,175,55,.45);
--serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;--sans:Manrope,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
--tC:#a9b8c9;--tB:#6fd3a5;--tA:#c39bff;--tS:#f1c75b;--nav-h:74px;--top-h:62px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:#0A050E}html,body{min-height:100%}
body{background:radial-gradient(ellipse at 50% -10%,#2b1242 0%,var(--violet) 48%,var(--obsidian) 100%) fixed;color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5;overflow-x:hidden;min-height:100vh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:inherit}
::selection{background:rgba(212,175,55,.35)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:rgba(212,175,55,.25);border-radius:8px}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#confetti{position:fixed;inset:0;width:100%;height:100%;z-index:300;pointer-events:none}
#app{position:relative;z-index:1;max-width:1120px;margin:0 auto;min-height:100vh;padding:calc(var(--top-h) + 16px) 14px calc(var(--nav-h) + 30px)}
.muted{color:var(--text-2)}.dim{color:var(--text-3)}.gold{color:var(--gold-2)}
.serif{font-family:var(--serif)}

/* ===================== ВЕРХНЯЯ ПАНЕЛЬ ===================== */
.topbar{position:fixed;top:0;left:0;right:0;z-index:60;height:var(--top-h);background:linear-gradient(180deg,rgba(10,5,14,.94),rgba(18,9,26,.78));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar-inner{max-width:1120px;margin:0 auto;height:100%;display:flex;align-items:center;gap:10px;padding:0 14px}
.logo{font-family:var(--serif);font-size:24px;font-weight:700;color:var(--gold);white-space:nowrap;display:flex;align-items:center;gap:8px;text-shadow:0 0 18px rgba(212,175,55,.4)}
.logo .cup{font-size:24px;filter:drop-shadow(0 0 8px rgba(212,175,55,.5))}
.wallet{display:flex;gap:6px;margin-left:auto;align-items:center}
.pill{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-weight:800;font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.avatar{display:flex;align-items:center;gap:8px;padding:3px 10px 3px 3px;border-radius:999px;border:1px solid var(--line-2);background:linear-gradient(135deg,rgba(90,20,48,.6),rgba(30,12,40,.6))}
.avatar .ava{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 30% 30%,#8a2a55,#3a0d22);font-size:17px;border:1px solid var(--gold)}
.avatar .lv{font-size:11px;font-weight:800;color:var(--gold-2);line-height:1.1;text-align:left}
.xpbar{width:58px;height:4px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:3px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#b8862a,#f3d98b);width:0;transition:width .4s}
@media(max-width:640px){.logo .txt{display:none}.pill{padding:4px 8px;font-size:12px}.avatar .lvtxt{display:none}.avatar{padding:3px}}
@media(max-width:380px){.pill.raw-pill{display:none}}

/* ===================== НИЖНЯЯ НАВИГАЦИЯ ===================== */
.bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:60;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:linear-gradient(0deg,rgba(10,5,14,.97),rgba(18,9,26,.85));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center}
.nav-inner{display:flex;width:100%;max-width:640px;justify-content:space-around;align-items:center}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--text-3);padding:6px 4px;border-radius:14px;transition:.2s;min-width:60px;position:relative}
.nav-btn .ic{font-size:22px;filter:grayscale(.7) brightness(.85);transition:.25s;line-height:1.2}
.nav-btn.active{color:var(--gold-2)}.nav-btn.active .ic{filter:none;transform:translateY(-2px) scale(1.08)}
.nav-btn.center .ic{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 30% 30%,#8f2a55,var(--burgundy) 60%,#2a0716);border:1.5px solid var(--gold);box-shadow:0 0 24px rgba(212,175,55,.4);margin-top:-30px;font-size:28px;filter:none;animation:pulseGlow 3s ease-in-out infinite}
.nav-btn .dot{position:absolute;top:4px;right:12px;width:8px;height:8px;border-radius:50%;background:#ff5d8f;box-shadow:0 0 8px #ff5d8f;display:none}
.nav-btn .dot.on{display:block}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 18px rgba(212,175,55,.3)}50%{box-shadow:0 0 34px rgba(212,175,55,.65)}}

/* ===================== БАЗОВЫЕ КОМПОНЕНТЫ ===================== */
.glass{background:linear-gradient(160deg,rgba(54,26,72,.55),rgba(20,10,30,.62));border:1px solid var(--line);border-radius:20px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 10px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.05)}
.glow{border-color:var(--line-2);box-shadow:0 0 0 1px rgba(212,175,55,.08),0 0 30px rgba(212,175,55,.12),0 10px 40px rgba(0,0,0,.4)}
.page-head{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;margin:6px 2px 18px}
.section-title{font-family:var(--serif);font-size:36px;color:var(--gold-2);font-weight:700;line-height:1.05;text-shadow:0 0 24px rgba(212,175,55,.25)}
.subtitle{color:var(--text-2);font-size:14px;margin-top:4px;max-width:560px}
h2.h2{font-family:var(--serif);font-size:26px;color:var(--gold-2);font-weight:700;line-height:1.1;margin-bottom:6px}
h3.h3{font-family:var(--serif);font-size:22px;font-weight:700;line-height:1.15}
.grid{display:grid;gap:14px}
.g-auto{grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.g-items{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;transition:transform .12s,background .2s,box-shadow .2s;border:1px solid var(--line);background:rgba(255,255,255,.05);white-space:nowrap;user-select:none}
.btn:hover{background:rgba(255,255,255,.1)}
.btn:active{transform:scale(.96)}
.btn-gold{background:linear-gradient(135deg,#f6e0a0,#d4af37 45%,#9c7a1c);color:#1d0e12;border-color:#f3d98b;box-shadow:0 4px 18px rgba(212,175,55,.35)}
.btn-gold:hover{background:linear-gradient(135deg,#fff0c0,#e2bd45 45%,#ad8822);box-shadow:0 6px 26px rgba(212,175,55,.5)}
.btn-wine{background:linear-gradient(135deg,#8f2a55,#5a1430);border-color:rgba(212,175,55,.5)}
.btn-wine:hover{background:linear-gradient(135deg,#a33463,#6c1a3b)}
.btn[disabled],.btn.disabled{opacity:.42;pointer-events:none;filter:grayscale(.6)}
.btn-sm{padding:6px 10px;font-size:12.5px;border-radius:10px}
.btn-lg{padding:14px 24px;font-size:16px;border-radius:14px}
.btn-block{width:100%}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:12.5px;font-weight:600}
.tier{display:inline-block;font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:6px;letter-spacing:.4px;vertical-align:middle}
.tier-C{color:var(--tC);background:rgba(169,184,201,.12);border:1px solid rgba(169,184,201,.35)}
.tier-B{color:var(--tB);background:rgba(111,211,165,.1);border:1px solid rgba(111,211,165,.4)}
.tier-A{color:var(--tA);background:rgba(195,155,255,.1);border:1px solid rgba(195,155,255,.45)}
.tier-S{color:var(--tS);background:rgba(241,199,91,.12);border:1px solid rgba(241,199,91,.6);box-shadow:0 0 10px rgba(241,199,91,.25)}
.divider{height:1px;background:linear-gradient(90deg,transparent,var(--line-2),transparent);margin:16px 0;position:relative}
.divider.star::after{content:"✦";position:absolute;left:50%;top:50%;transform:translate(-50%,-55%);color:var(--gold);font-size:12px;padding:0 8px;text-shadow:0 0 8px rgba(212,175,55,.8)}
.tabs{display:flex;gap:6px;padding:4px;border-radius:14px;background:rgba(0,0,0,.25);border:1px solid var(--line);width:max-content;max-width:100%;overflow:auto}
.tabs button{padding:8px 14px;border-radius:10px;font-weight:700;font-size:13px;color:var(--text-2);white-space:nowrap}
.tabs button.on{background:linear-gradient(135deg,rgba(212,175,55,.25),rgba(143,42,85,.35));color:var(--gold-2);box-shadow:inset 0 0 0 1px var(--line-2)}
.empty{padding:28px;text-align:center;color:var(--text-2)}
.empty .big{font-size:42px;display:block;margin-bottom:6px}

/* Иконки предметов */
.ii{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:12px;font-size:24px;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.12),rgba(0,0,0,.2));border:1px solid var(--line);flex:none;position:relative}
.ii.sm{width:30px;height:30px;font-size:16px;border-radius:9px}
.ii.lg{width:74px;height:74px;font-size:40px;border-radius:18px}
.ii.t-C{border-color:rgba(169,184,201,.4)}.ii.t-B{border-color:rgba(111,211,165,.5)}.ii.t-A{border-color:rgba(195,155,255,.6);box-shadow:0 0 14px rgba(195,155,255,.25)}.ii.t-S{border-color:rgba(241,199,91,.8);box-shadow:0 0 18px rgba(241,199,91,.4)}
.bean{display:inline-block;width:.62em;height:.86em;border-radius:50%;transform:rotate(28deg);position:relative;background:radial-gradient(circle at 35% 30%,#a7704a,#5b3219 55%,#2c160a);box-shadow:inset -2px -2px 4px rgba(0,0,0,.4)}
.bean::after{content:"";position:absolute;left:50%;top:10%;bottom:10%;width:2px;margin-left:-1px;border-radius:2px;background:rgba(20,8,2,.75);transform:skewY(10deg)}
.bean.t-B{background:radial-gradient(circle at 35% 30%,#b98a52,#6d4320 55%,#2e1a08)}
.bean.t-A{background:radial-gradient(circle at 35% 30%,#c9a0ff,#6b3fa8 55%,#2b1450);box-shadow:0 0 8px rgba(195,155,255,.6)}
.bean.t-S{background:radial-gradient(circle at 35% 30%,#fff1b8,#d4af37 50%,#6d520f);box-shadow:0 0 12px rgba(241,199,91,.9)}
.bean.raw{background:radial-gradient(circle at 35% 30%,#c9d18a,#7d8a3c 55%,#3a4318)}

.item{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:12px 10px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.03);transition:.2s;position:relative}
.item.sel{border-color:var(--gold);background:linear-gradient(160deg,rgba(212,175,55,.16),rgba(143,42,85,.2));box-shadow:0 0 22px rgba(212,175,55,.25)}
.item:hover{border-color:var(--line-2)}
.item .nm{font-weight:700;font-size:13px;line-height:1.25}
.item .ds{font-size:11.5px;color:var(--text-3);line-height:1.3}
.item .cnt{position:absolute;top:8px;right:8px;font-size:11px;font-weight:800;color:var(--gold-2);background:rgba(0,0,0,.4);padding:1px 7px;border-radius:999px;border:1px solid var(--line)}
.item.click{cursor:pointer}

/* ===================== МОДАЛКИ / ТОСТЫ ===================== */
.modal-wrap{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:16px;background:rgba(5,2,8,.66);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;transition:opacity .25s}
.modal-wrap.show{opacity:1}
.modal{width:100%;max-width:520px;max-height:calc(100vh - 32px);overflow:auto;padding:22px;position:relative;transform:translateY(16px) scale(.97);transition:transform .3s cubic-bezier(.2,.9,.3,1.2);border-color:var(--line-2)}
.modal-wrap.show .modal{transform:none}
.modal.wide{max-width:760px}
.modal-x{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--text-2);background:rgba(255,255,255,.06);z-index:2}
.modal-x:hover{background:rgba(255,255,255,.12);color:#fff}
#toasts{position:fixed;left:50%;top:calc(var(--top-h) + 10px);transform:translateX(-50%);z-index:400;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,420px)}
.toast{padding:10px 16px;border-radius:14px;background:linear-gradient(135deg,rgba(54,26,72,.95),rgba(30,12,40,.95));border:1px solid var(--line-2);box-shadow:0 10px 30px rgba(0,0,0,.5);font-size:13.5px;font-weight:600;animation:toastIn .35s cubic-bezier(.2,.9,.3,1.3);transition:.35s;text-align:center}
.toast.good{border-color:rgba(111,211,165,.6)}.toast.bad{border-color:rgba(255,93,143,.6)}.toast.gold{border-color:var(--gold);box-shadow:0 0 24px rgba(212,175,55,.4)}
.toast.out{opacity:0;transform:translateY(-10px)}
@keyframes toastIn{from{opacity:0;transform:translateY(-14px) scale(.95)}}
.float-num{position:absolute;font-weight:800;color:var(--gold-2);font-size:13px;pointer-events:none;animation:floatUp 1.4s ease-out forwards;text-shadow:0 0 8px rgba(212,175,55,.8);white-space:nowrap}
@keyframes floatUp{from{opacity:0;transform:translateY(0)}20%{opacity:1}to{opacity:0;transform:translateY(-46px)}}
.fade-in{animation:fadeIn .45s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}}

/* ===================== ПЛАНТАЦИИ ===================== */
.stat-box{padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:260px}
.stat-box .big{font-size:24px;font-weight:800;color:var(--gold-2);font-variant-numeric:tabular-nums}
.plant-card{overflow:hidden;display:flex;flex-direction:column}
.plant-banner{height:118px;position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:12px 14px}
.plant-banner::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 70% 0%,rgba(255,255,255,.18),transparent 60%)}
.plant-banner .hills{position:absolute;left:-10%;right:-10%;bottom:-30px;height:70px;border-radius:50% 50% 0 0;background:rgba(0,0,0,.35)}
.plant-banner .hills.h2{bottom:-40px;left:20%;height:80px;background:rgba(0,0,0,.25)}
.plant-banner .pic{position:absolute;right:16px;top:12px;font-size:48px;filter:drop-shadow(0 4px 12px rgba(0,0,0,.5))}
.plant-banner .bushes{position:absolute;left:14px;bottom:8px;display:flex;gap:6px;z-index:1}
.bush{font-size:22px;animation:sway 3s ease-in-out infinite;transform-origin:bottom center;display:inline-block}
.bush:nth-child(2){animation-delay:.4s}.bush:nth-child(3){animation-delay:.8s}.bush:nth-child(4){animation-delay:1.2s}.bush:nth-child(5){animation-delay:1.6s}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.plant-banner .tag{position:absolute;top:10px;left:12px;z-index:1}
.plant-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.plant-stats{display:flex;gap:8px;flex-wrap:wrap}
.upg{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;background:rgba(0,0,0,.2);border:1px solid rgba(212,175,55,.12)}
.upg .ui{font-size:20px;width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:rgba(255,255,255,.05)}
.upg .ut{flex:1;min-width:0}.upg .ut b{font-size:13.5px}.upg .ut div{font-size:11.5px;color:var(--text-3)}
.lvl-dots{font-size:11px;color:var(--gold-2);font-weight:800}
.plant-card.locked .plant-banner{filter:grayscale(.75) brightness(.6)}
.lock-box{padding:12px;border-radius:14px;border:1px dashed var(--line-2);text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}

/* ===================== КЕЙСЫ ===================== */
.case-card{padding:20px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;position:relative;overflow:hidden}
.case-card::before{content:"";position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent,var(--cc,rgba(212,175,55,.18)),transparent 30%);animation:spin 9s linear infinite;opacity:.7}
.case-card>*{position:relative}
@keyframes spin{to{transform:rotate(360deg)}}
.orb{width:128px;height:128px;border-radius:50%;display:grid;place-items:center;font-size:62px;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.35),var(--oc,#5a1430) 45%,#12091a 100%);border:2px solid var(--gold);box-shadow:0 0 40px var(--og,rgba(212,175,55,.4)),inset 0 -10px 30px rgba(0,0,0,.5);animation:bob 4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.orb.shake{animation:shake .12s linear infinite}
@keyframes shake{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(-4px,2px) rotate(-4deg)}50%{transform:translate(3px,-3px) rotate(3deg)}75%{transform:translate(-2px,-2px) rotate(-2deg)}100%{transform:translate(0,0) rotate(0)}}
.orb.big{width:170px;height:170px;font-size:84px}
.case-open{display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px 0;text-align:center;min-height:300px;justify-content:center}
.burst{position:absolute;left:50%;top:50%;width:10px;height:10px;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,#fff 0%,rgba(243,217,139,.9) 30%,transparent 70%);animation:burst .9s ease-out forwards;pointer-events:none}
@keyframes burst{to{width:900px;height:900px;opacity:0}}
.loot-grid{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.loot{width:132px;padding:14px 8px;border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;background:rgba(0,0,0,.3);border:1px solid var(--line);animation:lootIn .6s cubic-bezier(.2,.9,.3,1.4) both}
.loot.t-B{border-color:rgba(111,211,165,.6)}.loot.t-A{border-color:rgba(195,155,255,.7);box-shadow:0 0 24px rgba(195,155,255,.35)}.loot.t-S{border-color:var(--tS);box-shadow:0 0 34px rgba(241,199,91,.55);background:linear-gradient(160deg,rgba(241,199,91,.18),rgba(0,0,0,.3))}
.loot .nm{font-size:12.5px;font-weight:700;line-height:1.25}
@keyframes lootIn{from{opacity:0;transform:rotateY(90deg) scale(.6)}}
.odds-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid rgba(212,175,55,.08);font-size:13px}
.odds-row .pc{margin-left:auto;font-weight:800;color:var(--gold-2);font-variant-numeric:tabular-nums}
.tier-bar{display:flex;height:10px;border-radius:6px;overflow:hidden;margin:8px 0 14px}
.tier-bar i{display:block;height:100%}

/* ===================== РИТУАЛ ===================== */
.steps{display:flex;gap:6px;align-items:center;justify-content:center;margin:2px 0 18px;flex-wrap:wrap}
.stp{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--text-3)}
.stp .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);font-size:12px}
.stp.on{color:var(--gold-2)}.stp.on .n{background:linear-gradient(135deg,#f3d98b,#b8862a);color:#1d0e12;border-color:var(--gold);box-shadow:0 0 14px rgba(212,175,55,.5)}
.stp.done .n{background:rgba(212,175,55,.2);color:var(--gold-2)}
.stp-line{width:22px;height:1px;background:var(--line-2)}
@media(max-width:560px){.stp .l{display:none}}
.ritual-hero{text-align:center;padding:26px 18px;position:relative;overflow:hidden}
.ritual-panel{padding:18px}
.luck-meter{height:10px;border-radius:10px;background:rgba(255,255,255,.08);overflow:hidden;margin:6px 0}
.luck-meter i{display:block;height:100%;background:linear-gradient(90deg,#5a1430,#d4af37,#fff0c0);transition:width .5s}
.brew-wrap{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.brew-wrap{grid-template-columns:1fr}}
.stir-box,.heat-box{padding:18px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
#stirCanvas{width:100%;max-width:300px;aspect-ratio:1;touch-action:none;cursor:grab;border-radius:50%}
.prog{width:100%;max-width:300px;height:8px;border-radius:8px;background:rgba(255,255,255,.08);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#b8862a,#f3d98b)}
.heat-box.locked{opacity:.45;pointer-events:none;filter:grayscale(.5)}
.cezve-area{display:flex;gap:16px;align-items:flex-end;justify-content:center;position:relative}
.cezve{width:200px;height:220px}
.gauge{width:22px;height:200px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid var(--line);position:relative;overflow:hidden}
.gauge .zone{position:absolute;left:0;right:0;bottom:72%;height:16%;background:rgba(212,175,55,.35);border-top:1px solid var(--gold);border-bottom:1px solid var(--gold)}
.gauge .fill{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(0deg,#5a1430,#e2763a,#f3d98b)}
.flame{transform-origin:center bottom;animation:flick .25s ease-in-out infinite alternate;opacity:.35;transition:opacity .3s}
.heating .flame{opacity:1}
@keyframes flick{from{transform:scaleY(.9) scaleX(1.05)}to{transform:scaleY(1.12) scaleX(.95)}}
.steam{position:absolute;left:50%;top:-10px;width:120px;height:110px;transform:translateX(-50%);pointer-events:none}
.steam span{position:absolute;bottom:0;width:14px;height:60px;border-radius:50%;background:radial-gradient(ellipse,rgba(255,240,220,.55),transparent 70%);filter:blur(5px);animation:steam 3s ease-in infinite;opacity:0}
.steam span:nth-child(1){left:20%}.steam span:nth-child(2){left:45%;animation-delay:1s}.steam span:nth-child(3){left:70%;animation-delay:2s}
@keyframes steam{0%{transform:translateY(0) scaleX(1);opacity:0}25%{opacity:var(--so,.7)}100%{transform:translateY(-90px) scaleX(2.4) rotate(12deg);opacity:0}}
.hold-btn{touch-action:none;user-select:none;-webkit-user-select:none}
.flip-stage{height:300px;position:relative;display:grid;place-items:center;perspective:800px}
.saucer{position:absolute;bottom:40px;width:260px;height:46px;border-radius:50%;background:radial-gradient(ellipse at 50% 35%,#f5ecdf,#cdb89c 60%,#8a7458);box-shadow:0 14px 30px rgba(0,0,0,.6),inset 0 -4px 8px rgba(0,0,0,.25);border:2px solid var(--gold)}
.flip-cup{position:absolute;bottom:72px;width:160px;height:150px;transition:transform 1.3s cubic-bezier(.6,-0.2,.3,1.3)}
.flip-cup.flipped{transform:translateY(20px) rotate(180deg)}
.drip-count{font-family:var(--serif);font-size:44px;color:var(--gold-2);text-shadow:0 0 20px rgba(212,175,55,.6)}

/* ===================== ГАДАНИЕ ===================== */
.reading-layout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;align-items:start}
@media(max-width:820px){.reading-layout{grid-template-columns:1fr}}
.cup-wrap{padding:14px;display:flex;flex-direction:column;align-items:center;gap:8px}
#groundsCanvas{width:100%;max-width:540px;aspect-ratio:1;cursor:crosshair;touch-action:manipulation;border-radius:50%;filter:drop-shadow(0 18px 40px rgba(0,0,0,.6))}
.reading-side{padding:18px;display:flex;flex-direction:column;gap:12px}
.found-list{display:flex;flex-direction:column;gap:8px}
.found{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;border:1px dashed rgba(212,175,55,.25);background:rgba(0,0,0,.2);font-size:13px}
.found.ok{border-style:solid;border-color:var(--line-2);background:linear-gradient(135deg,rgba(212,175,55,.12),rgba(143,42,85,.15));animation:fadeIn .4s}
.found .si{font-size:22px;width:36px;text-align:center}
.fortune-head{padding:22px;text-align:center;position:relative;overflow:hidden}
.fortune-head .ttl{font-family:var(--serif);font-size:34px;color:var(--gold-2);font-weight:700;line-height:1.1}
.fortune-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
@media(max-width:760px){.fortune-grid{grid-template-columns:1fr}}
.fcard{padding:18px 18px 20px;position:relative;cursor:pointer;min-height:150px}
.fcard h4{font-family:var(--serif);font-size:23px;color:var(--gold-2);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.fcard p{font-size:14.5px;line-height:1.65;color:var(--text);white-space:pre-line}
.fcard.typing p::after{content:"▍";color:var(--gold);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.fcard.f-love{background:linear-gradient(160deg,rgba(120,24,60,.5),rgba(20,10,30,.62))}
.fcard.f-wealth{background:linear-gradient(160deg,rgba(110,84,20,.42),rgba(20,10,30,.62))}
.fcard.f-secrets{background:linear-gradient(160deg,rgba(60,30,120,.5),rgba(20,10,30,.62))}
.fcard.f-advice{background:linear-gradient(160deg,rgba(30,80,90,.42),rgba(20,10,30,.62))}
.vn-oracle{display:flex;gap:12px;align-items:center;justify-content:center;margin-top:8px}
.oracle-ava{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:radial-gradient(circle at 30% 30%,#7a3fb0,#2b1450);border:1.5px solid var(--gold);box-shadow:0 0 18px rgba(195,155,255,.5)}
.reward-box{padding:16px;margin-top:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}
.stars5{color:var(--gold);letter-spacing:2px;font-size:18px}
.hist-item{display:flex;gap:12px;align-items:center;padding:14px;cursor:pointer;transition:.2s}
.hist-item:hover{border-color:var(--line-2);transform:translateY(-2px)}
.hist-ic{font-size:22px;display:flex;gap:2px;flex-wrap:wrap;width:74px;justify-content:center}
.atlas{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px}
.atlas .sym{padding:12px 6px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.2);text-align:center;font-size:12px}
.atlas .sym .e{font-size:30px;display:block}
.atlas .sym.lock{opacity:.4;filter:grayscale(1)}

/* ===================== ПРОФИЛЬ / ОНБОРДИНГ ===================== */
.zodiac{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.zodiac button{padding:10px 4px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.03);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
.zodiac button .zi{font-size:22px;color:var(--gold-2)}
.zodiac button.on{border-color:var(--gold);background:linear-gradient(135deg,rgba(212,175,55,.2),rgba(143,42,85,.25));box-shadow:0 0 16px rgba(212,175,55,.3)}
.field{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line-2);background:rgba(0,0,0,.3);outline:none;font-size:15px}
.field:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,55,.15)}
.daily-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:14px 0}
.dday{padding:10px 2px;border-radius:12px;border:1px solid var(--line);text-align:center;font-size:10.5px;background:rgba(0,0,0,.2)}
.dday .e{font-size:20px;display:block;margin:2px 0}
.dday.past{opacity:.45}.dday.now{border-color:var(--gold);background:linear-gradient(160deg,rgba(212,175,55,.25),rgba(143,42,85,.3));box-shadow:0 0 18px rgba(212,175,55,.4);transform:scale(1.06)}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat-grid div{padding:10px;border-radius:12px;background:rgba(0,0,0,.22);border:1px solid rgba(212,175,55,.12);font-size:12px;color:var(--text-2)}
.stat-grid b{display:block;font-size:18px;color:var(--gold-2)}
.switch{width:46px;height:26px;border-radius:26px;background:rgba(255,255,255,.12);position:relative;transition:.2s;border:1px solid var(--line)}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.switch.on{background:linear-gradient(135deg,#d4af37,#9c7a1c)}.switch.on::after{left:22px}
.share-preview{width:100%;max-height:62vh;object-fit:contain;border-radius:14px;border:1px solid var(--line-2);background:#000}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>

function deepMerge(base,src){for(const k in src){const v=src[k];if(v&&typeof v==='object'&&!Array.isArray(v)&&base[k]&&typeof base[k]==='object'&&!Array.isArray(base[k]))deepMerge(base[k],v);else base[k]=v;}return base;}

  ensure(){if(!this.ctx){const A=window.AudioContext||window.webkitAudioContext;if(A)try{this.ctx=new A();}catch(e){}}if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();return this.ctx;},
  tone(f,d=.15,type='sine',v=.08,delay=0){if(!S.settings.sound)return;const c=this.ensure();if(!c)return;const t=c.currentTime+delay;const o=c.createOscillator(),g=c.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.03);},
  noise(d=.4,v=.05,f=1200){if(!S.settings.sound)return;const c=this.ensure();if(!c)return;const len=Math.floor(c.sampleRate*d),b=c.createBuffer(1,len,c.sampleRate),ch=b.getChannelData(0);

const Confetti={parts:[],running:false,
  burst(n=120,colors=['#D4AF37','#F3D98B','#ff7fb0','#c39bff','#ffffff','#8f2a55']){const c=$('#confetti'),dpr=Math.min(2,window.devicePixelRatio||1);
    c.width=innerWidth*dpr;c.height=innerHeight*dpr;const W=innerWidth,H=innerHeight;
    for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=4+Math.random()*11;this.parts.push({x:W/2,y:H*.42,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-6,s:4+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.35,c:colors[i%colors.length],life:110+Math.random()*70,star:Math.random()<.3});}
    if(!this.running){this.running=true;requestAnimationFrame(()=>this.step(dpr));}},
  step(dpr){const c=$('#confetti'),x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,c.width,c.height);
    this.parts=this.parts.filter(p=>p.life>0);
    for(const p of this.parts){p.life--;p.vy+=.28;p.vx*=.985;p.vy*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.globalAlpha=Math.min(1,p.life/40);x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;
      if(p.star){x.font=(p.s*2.4)+'px serif';x.fillText('✦',-p.s,p.s);}else x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore();}
    if(this.parts.length)requestAnimationFrame(()=>this.step(dpr));else{this.running=false;x.clearRect(0,0,c.width,c.height);}}
};

const Stars={init(){const c=$('#stars'),x=c.getContext('2d');let W,H,st=[],shoot=null;const dpr=Math.min(2,window.devicePixelRatio||1);
  const resize=()=>{W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);
    st=Array.from({length:Math.round(W*H/5500)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.2,p:Math.random()*6.28,s:.5+Math.random()*1.5,g:Math.random()<.15}));};
  resize();addEventListener('resize',resize);
  const motes=Array.from({length:18},()=>({x:Math.random(),y:Math.random(),v:.00004+Math.random()*.00008,r:20+Math.random()*60}));
  const loop=t=>{x.clearRect(0,0,W,H);
    for(const m of motes){m.y-=m.v*16;if(m.y<-.1)m.y=1.1;const g=x.createRadialGradient(m.x*W,m.y*H,0,m.x*W,m.y*H,m.r);g.addColorStop(0,'rgba(143,42,85,.07)');g.addColorStop(1,'rgba(143,42,85,0)');x.fillStyle=g;x.fillRect(m.x*W-m.r,m.y*H-m.r,m.r*2,m.r*2);}
    for(const s of st){const a=.35+.65*Math.abs(Math.sin(t/1000*s.s+s.p));x.globalAlpha=a;x.fillStyle=s.g?'#F3D98B':'#fff';x.beginPath();x.arc(s.x,s.y,s.r,0,6.283);x.fill();}
    x.globalAlpha=1;
    if(!shoot&&Math.random()<.003)shoot={x:Math.random()*W*.8,y:Math.random()*H*.4,l:0};
    if(shoot){shoot.l+=1;const px=shoot.x+shoot.l*9,py=shoot.y+shoot.l*4;const g=x.createLinearGradient(px,py,px-90,py-40);g.addColorStop(0,'rgba(243,217,139,.9)');g.addColorStop(1,'rgba(243,217,139,0)');
      x.strokeStyle=g;x.lineWidth=1.6;x.beginPath();x.moveTo(px,py);x.lineTo(px-90,py-40);x.stroke();if(shoot.l>60)shoot=null;}
    requestAnimationFrame(loop);};
  requestAnimationFrame(loop);}};

const Grounds={
  W:600,
  makeNoise(rng){const N=64,g=new Float32Array(N*N);for(let i=0;i<g.length;i++)g[i]=rng();const sm=t=>t*t*(3-2*t);
    return(x,y)=>{const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,X0=xi&63,X1=(xi+1)&63,Y0=(yi&63)*N,Y1=((yi+1)&63)*N;

  render(canvas,seed,symIds){
    const W=this.W,cx=W/2,cy=W/2,x=canvas.getContext('2d');const rng=mulberry32(seed>>>0);const nz=this.makeNoise(rng);
    const fbm=(a,b)=>nz(a,b)*.55+nz(a*2.1+5,b*2.1+9)*.3+nz(a*4.3+11,b*4.3+3)*.15;

      x.fillStyle=g;x.fillRect(px-r,py-r,r*2,r*2);}
    // подтёки от центра к краю (чашку перевернули)
    x.lineCap='round';

    // знаки
    const placed=[];
    for(const id of symIds){let tries=0,px,py;do{const a=rng()*6.283,d=40+rng()*170;px=cx+Math.cos(a)*d;py=cy+Math.sin(a)*d;tries++;}
      while(tries<120&&placed.some(p=>Math.hypot(p.x-px,p.y-py)<145));
      const s=80+rng()*22,rot=(rng()-.5)*.7;placed.push({id,x:px,y:py,s,rot});this.drawSymbol(x,id,px,py,s,rot,rng);}

  },

};

  total(){return Object.keys(PLANTS).reduce((s,id)=>s+this.rate(id),0);},

};

const Share={
  wrap(x,text,maxW,maxLines){const words=text.split(/\s+/),lines=[];let cur='';
    for(const w of words){const t=cur?cur+' '+w:w;if(x.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;if(lines.length===maxLines)break;}else cur=t;}
    if(lines.length<maxLines&&cur)lines.push(cur);
    if(lines.length===maxLines&&lines.join(' ').length<text.length-1){let l=lines[maxLines-1];while(x.measureText(l+'…').width>maxW&&l.length)l=l.slice(0,-1);lines[maxLines-1]=l.replace(/[\s,.;:—-]+$/,'')+'…';}
    return lines;},
  async make(e){try{if(document.fonts&&document.fonts.ready)await document.fonts.ready;}catch(_){}
    const W=1080,H=1920,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d'),rng=mulberry32(e.seed);
    let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#2b1242');g.addColorStop(.45,'#12091A');g.addColorStop(1,'#0A050E');x.fillStyle=g;x.fillRect(0,0,W,H);
    g=x.createRadialGradient(W/2,560,50,W/2,560,700);g.addColorStop(0,'rgba(143,42,85,.45)');g.addColorStop(1,'rgba(143,42,85,0)');x.fillStyle=g;x.fillRect(0,0,W,H);
    for(let i=0;i<320;i++){x.globalAlpha=.2+rng()*.8;x.fillStyle=rng()<.2?'#F3D98B':'#fff';x.beginPath();x.arc(rng()*W,rng()*H,rng()*2.2,0,7);x.fill();}x.globalAlpha=1;
    const gold=x.createLinearGradient(0,0,W,H);gold.addColorStop(0,'#f6e0a0');gold.addColorStop(.5,'#D4AF37');gold.addColorStop(1,'#9c7a1c');
    x.strokeStyle=gold;x.lineWidth=5;x.strokeRect(40,40,W-80,H-80);x.lineWidth=1.6;x.strokeRect(60,60,W-120,H-120);
    for(const[cx,cy]of[[60,60],[W-60,60],[60,H-60],[W-60,H-60]]){x.fillStyle='#12091A';x.beginPath();x.arc(cx,cy,22,0,7);x.fill();x.stroke();x.fillStyle=gold;x.font='30px serif';x.textAlign='center';x.textBaseline='middle';x.fillText('✦',cx,cy+1);}
    x.textBaseline='alphabetic';x.textAlign='center';
    x.fillStyle=gold;x.font='700 84px "Cormorant Garamond",Georgia,serif';x.fillText('Кофейный Оракул',W/2,170);
    x.fillStyle='rgba(244,236,247,.75)';x.font='500 30px Manrope,"Segoe UI",Arial,sans-serif';x.fillText(`${S.name||'Странница'} · ${new Date(e.ts).toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'})}`,W/2,222);
    x.strokeStyle='rgba(212,175,55,.6)';x.lineWidth=1.5;x.beginPath();x.moveTo(180,258);x.lineTo(500,258);x.moveTo(580,258);x.lineTo(900,258);x.stroke();x.fillStyle=gold;x.font='26px serif';x.fillText('✦ ✦ ✦',W/2,268);
    const gc=document.createElement('canvas');gc.width=gc.height=600;const placed=Grounds.render(gc,e.seed,e.symbols);
    const R0=255,CX=W/2,CY=545;x.save();x.shadowColor='rgba(212,175,55,.6)';x.shadowBlur=50;x.fillStyle='#000';x.beginPath();x.arc(CX,CY,R0,0,7);x.fill();x.restore();
    x.save();x.beginPath();x.arc(CX,CY,R0,0,7);x.clip();x.drawImage(gc,CX-R0*1.035,CY-R0*1.035,R0*2.07,R0*2.07);
    const sc=R0*2.07/600;for(const p of placed){x.strokeStyle='rgba(243,217,139,.9)';x.lineWidth=3;x.setLineDash([10,7]);x.beginPath();x.arc(CX-R0*1.035+p.x*sc,CY-R0*1.035+p.y*sc,p.s*.6*sc,0,7);x.stroke();}x.setLineDash([]);x.restore();
    x.strokeStyle=gold;x.lineWidth=6;x.beginPath();x.arc(CX,CY,R0+4,0,7);x.stroke();x.lineWidth=1.5;x.beginPath();x.arc(CX,CY,R0+20,0,7);x.stroke();
    x.fillStyle='#F3D98B';x.font='600 36px "Cormorant Garamond",Georgia,serif';x.fillText(e.symbols.map(id=>SYMBOLS[id].icon+' '+SYMBOLS[id].name).join('   '),W/2,875);
    x.fillStyle='#fff';x.font='italic 600 44px "Cormorant Garamond",Georgia,serif';x.fillText(this.wrap(x,e.texts.title,900,1)[0],W/2,935);
    let y=1005;
    for(const s of SECTIONS){x.textAlign='left';x.fillStyle='#F3D98B';x.font='700 38px "Cormorant Garamond",Georgia,serif';x.fillText(s.icon+' '+s.title,110,y);y+=44;
      x.fillStyle='rgba(244,236,247,.9)';x.font='500 27px Manrope,"Segoe UI",Arial,sans-serif';const body=e.texts[s.id].split('. ').slice(1).join('. ')||e.texts[s.id];
      for(const l of this.wrap(x,body,860,3)){x.fillText(l,110,y);y+=37;}y+=26;}
    x.textAlign='center';const st=Math.round(e.luck/20);x.fillStyle=gold;x.font='700 40px "Cormorant Garamond",Georgia,serif';x.fillText(`Индекс удачи: ${e.luck}%   ${'★'.repeat(st)}${'☆'.repeat(5-st)}`,W/2,H-170);
    x.fillStyle='rgba(244,236,247,.55)';x.font='500 26px Manrope,"Segoe UI",Arial,sans-serif';x.fillText('☕ Кофейный Оракул · CofeeGushya',W/2,H-110);

  if(App.tab==='plant'){const fl=now-lastFloat>1000;if(fl)lastFloat=now;Plant.liveUpdate(fl);}}
function boot(){Stars.init();
  if(S.pending&&S.pending.symbols){Ritual.cur=S.pending;Ritual.step='reading';Ritual.sel.bean=S.pending.bean;}
  const off=Plant.offline();App.render();
  if(!S.onboarded)Onboard.show();else{if(off)showOffline(off);setTimeout(()=>Daily.check(),off?400:200);}
  setInterval(gameLoop,250);setInterval(save,5000);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});addEventListener('pagehide',save);addEventListener('beforeunload',save);
  document.addEventListener('pointerdown',()=>SFX.ensure(),{once:true});}

boot();
</script>
</body>
